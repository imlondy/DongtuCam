# XcodeGen 配置：避免手写易错的 project.pbxproj
# 用法（Mac）：brew install xcodegen && xcodegen generate --spec project.yml
name: DongtuCam
options:
  bundleIdPrefix: com.dongtu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # 免费 Apple ID 直装：把这里换成你自己的 Team ID（Xcode 里也能自动填）
    DEVELOPMENT_TEAM: ""
targets:
  DongtuCam:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    # 注意：XcodeGen 的 info 只接受字典形式，且「只有 path」时会重新生成默认
    # Info.plist 丢掉自定义键。必须用 properties 显式声明隐私权限键，
    # 否则 App 一调相机/麦克风/相册就被系统 TCC 判定缺 usage description 而闪退。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 动图相机
        CFBundleShortVersionString: "10.0"
        CFBundleVersion: "10"
        NSCameraUsageDescription: 拍摄商品实况动图
        NSMicrophoneUsageDescription: 录制动图时同步录音（可在设置里关闭）
        NSPhotoLibraryAddUsageDescription: 把生成好的实况动图直接保存到相册
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongtu.cam
