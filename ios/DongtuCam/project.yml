# XcodeGen 配置：避免手写易错的 project.pbxproj
# 用法（Mac）：brew install xcodegen && xcodegen generate --spec project.yml
name: DongtuCam
options:
  bundleIdPrefix: com.dongtu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    # 免费 Apple ID 直装：把这里换成你自己的 Team ID（Xcode 里也能自动填）
    DEVELOPMENT_TEAM: ""
targets:
  DongtuCam:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    # 注意：这里必须是「字符串形式」= 直接使用现有 Info.plist 原样打包，
    # 千万不能写成 info: { path: Info.plist } 这种字典形式——XcodeGen 会把
    # Info.plist 重新生成为默认模板，丢掉 NSCameraUsageDescription 等隐私权限键，
    # 导致 App 一调相机就被系统 TCC 直接 SIGABRT 闪退。
    info: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dongtu.cam
